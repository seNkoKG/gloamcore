name: Windows release QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Exercise Windows release smoke tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm 11.16.0 and Node.js 24.14.0
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.16.0
          runtime: node@24.14.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows release QA
        run: pnpm release:qa

      - name: Verify generated files are current
        run: git diff --exit-code
