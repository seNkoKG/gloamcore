name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build on Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm 11.16.0 and Node.js 24.14.0
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.16.0
          runtime: node@24.14.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild pinned game-data packs
        run: node scripts/build-game-data-packs.mjs

      - name: Run non-GUI tests
        run: pnpm test

      - name: Type-check and build
        run: pnpm build

      - name: Check release publisher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/publish-github-release.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify generated files are current
        run: git diff --exit-code

  android:
    name: Sync and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm 11.16.0 and Node.js 24.14.0
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.16.0
          runtime: node@24.14.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sync Android
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec cap sync android

      - name: Verify Android project is current
        run: git diff --exit-code -- android

      - name: Compile Android debug app
        run: bash android/gradlew -p android --no-daemon assembleDebug

  ios:
    name: Sync and build iOS
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm 11.16.0 and Node.js 24.14.0
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.16.0
          runtime: node@24.14.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sync iOS
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec cap sync ios
          node scripts/normalize-capacitor-spm.mjs

      - name: Verify iOS project is current and package is parseable
        run: |
          git diff --exit-code -- ios
          swift package --package-path ios/App/CapApp-SPM dump-package > /dev/null

      - name: Compile iOS simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
